name: fork-release

# Push a branch named build/<version> (for example build/8.0.46-cloak.1) to build and publish.
on:
  push:
    branches: ['build/*']

permissions:
  contents: write

env:
  GO_VERSION: '1.26.10'

jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Build glibc 2.17 archive
        run: |
          set -euo pipefail
          export RELEASE_VERSION="${GITHUB_REF_NAME#build/}"
          export COMMIT="$(git rev-parse --short HEAD)"
          export BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export GOARCH=arm64
          archive_dir="dist/archive"
          mkdir -p "$archive_dir"
          docker run --rm -v "$PWD:/src" -w /src \
            -e GO_VERSION -e GOARCH -e RELEASE_VERSION -e COMMIT -e BUILD_DATE \
            quay.io/pypa/manylinux2014_aarch64 \
            bash -euo pipefail -c '
              go_archive="go${GO_VERSION}.linux-${GOARCH}.tar.gz"
              curl -fsSL "https://go.dev/dl/${go_archive}" -o "/tmp/${go_archive}"
              tar -C /usr/local -xzf "/tmp/${go_archive}"
              export PATH="/usr/local/go/bin:${PATH}"
              CGO_ENABLED=1 GOOS=linux GOARCH="${GOARCH}" go build -buildvcs=false \
                -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
                -o dist/archive/cli-proxy-api ./cmd/server/
            '
          cp LICENSE config.example.yaml "$archive_dir/"
          tar -C "$archive_dir" -czf "dist/CLIProxyAPI_${RELEASE_VERSION}_linux_aarch64.tar.gz" cli-proxy-api LICENSE config.example.yaml
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${GITHUB_REF_NAME#build/}"
          gh release create "v${RELEASE_VERSION}" "dist/CLIProxyAPI_${RELEASE_VERSION}_linux_aarch64.tar.gz" \
            --target "$GITHUB_SHA" --title "v${RELEASE_VERSION}" \
            --notes "Upstream plus upstream.claude.cloak-entrypoints (${GITHUB_SHA})."
