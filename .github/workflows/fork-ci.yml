name: fork-ci

on:
  push:
    branches: [cloak-entrypoints]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go test ./internal/config/... ./internal/runtime/executor/...
